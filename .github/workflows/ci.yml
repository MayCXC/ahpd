name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A push over a push is a run nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test should fail the run rather than sit on a runner for six hours,
    # which is the default. The whole job takes about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The `engines` field, and the version the tests are written against.
          node-version: 22
          cache: pnpm

      # Frozen, so a lockfile that does not match package.json fails here
      # rather than resolving to something nobody wrote down.
      - run: pnpm install --frozen-lockfile

      # Before the tests: the boundary is the claim these packages make, and a
      # host that imports a backend is worth failing for even when it passes.
      - name: The packages import only what they declare
        run: pnpm boundary

      - run: pnpm typecheck

      # Bounded, because a job that runs into the runner's own timeout is
      # cancelled rather than failed, and a cancelled job leaves no readable
      # log at all - which is how a shell test killing this process group came
      # to look like a hang for an afternoon.
      - name: Tests
        run: timeout 300 pnpm test:unit

      # Last, because it is the slowest and the only one that writes anything.
      - run: pnpm build

      # What would actually be published, which is not what `files` says until
      # something has packed it: `ahpd` ships no `src`, the libraries do.
      - name: Pack each package
        run: pnpm -r exec pnpm pack --pack-destination ${{ runner.temp }}

  # The same checks on Windows, where they are not all green yet. It reports
  # what fails rather than blocking a merge, until the plans that fix what it
  # finds have landed. Every step runs under bash, so this is the same commands
  # as `check` rather than a second version of them.
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      # Before the checkout: some paths under `.project/plans` are 185
      # characters long, and with the checkout folder in front they pass the 260
      # a Windows path may have, and the checkout fails with "Filename too long".
      - run: git config --global core.longpaths true
        shell: bash

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        shell: bash

      - name: The packages import only what they declare
        run: pnpm boundary
        shell: bash

      - run: pnpm typecheck
        shell: bash

      # Longer than `check`'s bound: the Windows run has never finished inside
      # 300 s, and a bound it runs into reports no failures at all.
      - name: Tests
        run: timeout 600 pnpm test:unit
        shell: bash

      # Last, because it is the slowest and the only one that writes anything.
      # `check` packs each package after this step and this job does not: what a
      # package would publish is one answer, and Linux's is it.
      - run: pnpm build
        shell: bash

  # The cases that start real processes and Docker containers: the daemon's
  # command line, the HTTP server, the computer plugin and a nested host. They
  # are most of the test time, so they run beside `check` on a runner of their
  # own, under the same bound.
  processes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: timeout 300 pnpm test:processes

  # `resourceWrite` is symmetrical, so this host implements the whole of it and
  # so does `ahpc`. `packages/sdk/test/fixtures/resource-write.json` is the same file in both
  # repositories and each runs it against its own implementation - which catches
  # a behavioural divergence, but not a case added on one side and never copied
  # to the other. This is what catches that.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: The write fixture matches ahpc's copy
        run: |
          set -u
          url=https://raw.githubusercontent.com/softov/ahpc/main/test/fixtures/resource-write.json
          code=$(curl -sS -o "$RUNNER_TEMP/theirs.json" -w '%{http_code}' "$url")
          if [ "$code" = "404" ]; then
            # Not landed over there yet. Said rather than failed, because the
            # two repositories are pushed one at a time and a red build for the
            # gap between them would be a build nobody could make green.
            echo "ahpc's main has no copy of this fixture yet. Nothing to compare."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Could not read ahpc's copy: HTTP $code"
            exit 1
          fi
          diff -u "$RUNNER_TEMP/theirs.json" packages/sdk/test/fixtures/resource-write.json && echo "The two copies are identical."
